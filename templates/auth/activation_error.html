<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lỗi Kích Hoạt Tài Khoản</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        .icon { font-size: 60px; color: #d9534f; margin-bottom: 15px; }
        h2 { color: #d9534f; margin-bottom: 10px; }
        p { color: #555; font-size: 15px; line-height: 1.5; }
        .btn-home { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">❌</div>
        <h2>Kích Hoạt Thất Bại</h2>
        <p>{{ error_message|default:"Mã token kích hoạt không hợp lệ hoặc đã hết hạn." }}</p>
        <a href="/" class="btn-home">Quay Lại Trang Chủ</a>
    </div>
</body>
</html>
